<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1324"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="umbrellaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="8"/>

  <!-- Cloud -->
  <path d="M160 260 a50 50 0 0 1 85 -35 a65 65 0 0 1 125 15 a45 45 0 0 1 -10 90 l-195 0 a45 45 0 0 1 -5 -70 z" 
        fill="url(#cyanGrad)" filter="url(#glow)" opacity="0.95"/>

  <!-- Rain Drops with glowing streak -->
  <line x1="180" y1="360" x2="165" y2="410" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <line x1="240" y1="360" x2="225" y2="425" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.9"/>
  <line x1="300" y1="360" x2="285" y2="415" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
  <line x1="360" y1="360" x2="345" y2="405" stroke="#38bdf8" stroke-width="8" stroke-linecap="round" opacity="0.75"/>

  <!-- Glowing Umbrella Shield Shielding Drops -->
  <path d="M 190 440 Q 256 380 322 440 Z" fill="url(#umbrellaGrad)" stroke="#ffffff" stroke-width="3" filter="url(#glow)"/>
  <path d="M 256 440 L 256 475 A 10 10 0 0 1 240 475" fill="none" stroke="#e2e8f0" stroke-width="5" stroke-linecap="round"/>
</svg>
